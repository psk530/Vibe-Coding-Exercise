<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>US TV Market - Brand Competition Dashboard</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{
  --c-red:#A5023D;      /* deep burgundy - primary accent */
  --c-pink:#FCEBEF;     /* pale pink - accent tint / soft backgrounds */
  --c-gray-dark:#6E6E6E;/* charcoal - secondary text */
  --c-gray-light:#EAEAEA;/* light gray - borders/dividers */
  --c-brown:#47422E;    /* dark olive-brown - primary text */
  --c-olive:#9C9160;    /* olive gold - secondary accent / muted labels */
  --c-khaki:#C7BD91;    /* light khaki - tertiary divider/accent */
  --c-cream:#DEDAC1;    /* pale cream - page background */
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow-x:hidden}
body{background:var(--c-cream);color:var(--c-brown);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:14px;line-height:1.5}
#root{height:100vh}
.app-shell{display:flex;height:100vh;width:100%}
.dashboard-col{flex:1;overflow-y:auto;padding:24px 28px;max-width:1440px;margin:0 auto;min-width:0;container-type:inline-size}
.resize-handle{width:6px;flex-shrink:0;cursor:col-resize;background:var(--c-khaki);transition:background .15s}
.resize-handle:hover{background:var(--c-red)}
.chat-col{display:flex;flex-direction:column;height:100vh;flex-shrink:0;background:#fff;border-left:1px solid var(--c-gray-light)}
.chat-header{padding:16px 18px;border-bottom:1px solid var(--c-gray-light);font-size:14px;font-weight:700;color:var(--c-brown);flex-shrink:0}
.chat-empty-hint{font-size:12px;color:var(--c-gray-dark);padding:14px 18px;line-height:1.6;border-bottom:1px solid var(--c-gray-light)}
.chat-messages{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.chat-msg{max-width:92%;padding:9px 12px;border-radius:10px;font-size:13px;line-height:1.55;white-space:pre-wrap}
.chat-msg.user{align-self:flex-end;background:var(--c-red);color:#fff;border-bottom-right-radius:2px}
.chat-msg.bot{align-self:flex-start;background:var(--c-pink);color:var(--c-brown);border-bottom-left-radius:2px}
.chat-msg.error{align-self:flex-start;background:#fde8e8;color:var(--c-red);border-bottom-left-radius:2px}
.chat-msg.pending{align-self:flex-start;background:var(--c-pink);color:var(--c-gray-dark);font-style:italic}
.chat-suggestions{display:flex;flex-direction:column;gap:6px;padding:10px 16px;border-top:1px solid var(--c-gray-light);flex-shrink:0}
.chat-suggestion-chip{text-align:left;background:var(--c-pink);border:1px solid var(--c-gray-light);border-radius:8px;padding:6px 10px;font-size:11.5px;color:var(--c-brown);cursor:pointer;transition:background .15s}
.chat-suggestion-chip:hover{background:#f8dde4}
.chat-suggestion-chip:disabled{opacity:.5;cursor:default}
.chat-input-row{display:flex;gap:8px;padding:14px 16px;border-top:1px solid var(--c-gray-light);flex-shrink:0}
.chat-input{flex:1;border:1px solid var(--c-gray-light);border-radius:8px;padding:8px 12px;font-size:13px;resize:none;outline:none;font-family:inherit}
.chat-input:focus{border-color:var(--c-red)}
.chat-send-btn{background:var(--c-red);color:#fff;border:none;border-radius:8px;padding:0 16px;font-size:13px;font-weight:600;cursor:pointer;flex-shrink:0}
.chat-send-btn:disabled{opacity:.5;cursor:default}
.header{margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--c-khaki);display:flex;align-items:center;gap:12px}
.header-badge{width:51px;height:51px;border-radius:50%;object-fit:cover;flex-shrink:0}
.header h1{font-size:19px;font-weight:700;color:var(--c-brown)}
.header p{font-size:12px;color:var(--c-gray-dark);margin-top:3px}
.header-actions{margin-left:auto;display:flex;gap:8px;flex-shrink:0}
.header-action-btn{background:#fff;border:1px solid var(--c-gray-light);border-radius:8px;padding:7px 16px;font-size:12px;font-weight:600;color:var(--c-brown);cursor:pointer;white-space:nowrap}
.header-action-btn:hover{background:var(--c-pink)}
.auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--c-cream)}
.auth-card{background:#fff;border-radius:12px;padding:32px;width:340px;border:1px solid var(--c-gray-light);box-shadow:0 4px 20px rgba(71,66,46,.10)}
.auth-title{font-size:18px;font-weight:700;color:var(--c-brown);margin-bottom:20px;text-align:center}
.auth-input{width:100%;padding:10px 12px;margin-bottom:10px;border:1px solid var(--c-gray-light);border-radius:8px;font-size:13px;outline:none;font-family:inherit}
.auth-input:focus{border-color:var(--c-red)}

.auth-btn:disabled{opacity:.6;cursor:default}
.auth-error{color:var(--c-red);font-size:12px;margin-bottom:8px}
.auth-msg{color:#1B8A2E;font-size:12px;margin-bottom:8px}
.auth-link{text-align:center;margin-top:16px;font-size:12px;color:#1a56db;cursor:pointer;text-decoration:underline}
.backoffice-page{min-height:100vh;background:var(--c-cream);padding:24px 28px}
.backoffice-card{background:#fff;border-radius:12px;padding:24px;border:1px solid var(--c-gray-light);box-shadow:0 1px 2px rgba(71,66,46,.06);max-width:1200px;margin:0 auto}
.backoffice-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.backoffice-title{font-size:17px;font-weight:700;color:var(--c-brown)}
.bo-table{width:100%;border-collapse:collapse;font-size:12px}
.bo-table th{text-align:left;padding:8px 10px;border-bottom:2px solid var(--c-khaki);color:var(--c-gray-dark);white-space:nowrap}
.bo-table td{padding:7px 10px;border-bottom:1px solid var(--c-gray-light);white-space:nowrap}
.bo-badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}
.bo-badge.active{background:#e6f4ea;color:#1B8A2E}
.bo-badge.inactive{background:#fde8e8;color:var(--c-red)}
.bo-badge.admin{background:var(--c-pink);color:var(--c-red)}
.bo-badge.user{background:var(--c-gray-light);color:var(--c-gray-dark)}
.bo-btn{background:#fff;border:1px solid var(--c-gray-light);border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;margin-right:4px;color:var(--c-brown)}

.bo-btn.danger{color:var(--c-red);border-color:var(--c-red)}
.bo-field{margin-bottom:12px}
.bo-field label{display:block;font-size:11px;color:var(--c-olive);text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin-bottom:5px}
.bo-field input,.bo-field select{width:100%;padding:8px 10px;border:1px solid var(--c-gray-light);border-radius:8px;font-size:13px;outline:none;font-family:inherit}
.bo-field input:focus,.bo-field select:focus{border-color:var(--c-red)}
.filters{background:#fff;border:1px solid var(--c-gray-light);border-radius:12px;padding:14px 20px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;box-shadow:0 1px 2px rgba(71,66,46,.06)}
.filter-group{display:flex;flex-direction:column;gap:6px}
.filter-label{font-size:11px;color:var(--c-olive);text-transform:uppercase;letter-spacing:0.5px;font-weight:600}
.filter-select{background:#fff;border:1px solid var(--c-gray-light);color:var(--c-brown);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;outline:none}
.filter-select:focus{border-color:var(--c-red)}
.brand-pills{display:flex;flex-wrap:wrap;gap:6px}
.brand-pill{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid;transition:all 0.15s;opacity:0.4;background:#fff}
.brand-pill.active{opacity:1}
.select-all-pill{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px dashed var(--c-olive);color:var(--c-gray-dark);background:var(--c-pink);flex-shrink:0;transition:background 0.15s}
.select-all-pill:hover{background:#f8dde4}
.insight-item{font-size:13px;line-height:1.6;color:var(--c-brown);padding-left:14px;position:relative}
.insight-item::before{content:'';position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:var(--c-red)}
.chart-header-insight{font-size:12px;color:var(--c-gray-dark);text-align:left;line-height:1.5;font-style:italic}
.hl{color:#1B8A2E;font-weight:700}
.insight-summary-badge{display:inline-block;background:var(--c-red);color:#fff;padding:6px 16px;border-radius:7px;font-size:14px;font-weight:800;letter-spacing:.3px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
.kpi-row{flex-wrap:wrap;row-gap:6px}
.kpi-card{background:#fff;border-radius:12px;padding:16px 18px;border:1px solid var(--c-gray-light);box-shadow:0 1px 2px rgba(71,66,46,.06)}
.kpi-label{font-size:11px;color:var(--c-olive);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;font-weight:600;display:flex;align-items:center;gap:6px}
.kpi-value{font-size:22px;font-weight:700;color:var(--c-brown)}
.kpi-sub{font-size:12px;color:var(--c-gray-dark);margin-top:3px}
.charts-grid-2{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,5fr);gap:14px;margin-bottom:14px}
.charts-grid-1{display:grid;grid-template-columns:minmax(0,1fr);margin-bottom:14px}
.chart-card{background:#fff;border-radius:12px;padding:18px 20px;border:1px solid var(--c-gray-light);box-shadow:0 1px 2px rgba(71,66,46,.06)}
.chart-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.chart-title{font-size:14px;font-weight:700;color:var(--c-brown);display:flex;align-items:center;gap:8px}
.chart-subtitle{font-size:11px;color:var(--c-gray-dark);margin-top:2px;margin-left:26px}
.num-badge{width:18px;height:18px;border-radius:50%;background:var(--c-red);color:#fff;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.toggle-group{display:flex;background:var(--c-pink);border-radius:8px;border:1px solid var(--c-gray-light);overflow:hidden;flex-shrink:0}
.toggle-btn{padding:4px 12px;font-size:12px;cursor:pointer;background:transparent;border:none;color:var(--c-gray-dark);transition:all 0.15s;font-weight:600}
.toggle-btn.active{background:var(--c-red);color:#fff}
.ctt{background:#fff;border:1px solid var(--c-gray-light);border-radius:8px;padding:10px 14px;font-size:12px;min-width:160px;box-shadow:0 4px 12px rgba(71,66,46,.12)}
.ctt-label{color:var(--c-gray-dark);margin-bottom:6px;font-size:11px;font-weight:600}
.ctt-item{display:flex;align-items:center;gap:7px;margin:3px 0}
.ctt-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.ctt-name{color:var(--c-gray-dark);flex:1}
.ctt-val{color:var(--c-brown);font-weight:600}
@media(max-width:900px){.kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.charts-grid-2{grid-template-columns:minmax(0,1fr)}}
@container (max-width:700px){.kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.charts-grid-2{grid-template-columns:minmax(0,1fr)}}
.chat-fab{display:none;position:fixed;bottom:20px;right:20px;width:52px;height:52px;border-radius:50%;background:var(--c-red);color:#fff;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(71,66,46,.3);border:none;cursor:pointer;z-index:999}
.chat-close-btn{display:none;background:none;border:none;color:var(--c-gray-dark);cursor:pointer;align-items:center;justify-content:center;flex-shrink:0}
.chat-header{display:flex;align-items:center;justify-content:space-between}
@media(max-width:640px){
  .app-shell{flex-direction:column;height:auto;min-height:100vh}
  .dashboard-col{max-width:100%;width:100%;padding:16px 14px}
  .resize-handle{display:none}
  .header{flex-wrap:wrap}
  .header-badge{width:38px;height:38px}
  .header h1{font-size:15px}
  .header p{font-size:10.5px}
  .header-actions{margin-left:0;width:100%}
  .header-action-btn{flex:1;padding:8px 10px}
  .filters{padding:12px 14px;gap:14px}
  .kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi-card{padding:12px 14px}
  .kpi-value{font-size:19px}
  .chart-card{padding:14px 16px}
  .auth-card{width:90vw;max-width:340px;padding:24px}
  .backoffice-page{padding:16px 14px}
  .backoffice-card{padding:16px}
  .chat-col{display:none}
  .chat-col.mobile-open{display:flex!important;position:fixed;inset:0;width:100%!important;height:100vh;z-index:1000}
  .chat-fab{display:flex}
  .chat-close-btn{display:inline-flex}
}
</style>

<body>
<div id="root"></div>
<script>
const BRANDS=['Samsung','LG','TCL','Insignia','HiSense','Amazon','Sony','Roku','Vizio','Toshiba'];
const COLORS=['#9c0037','#dc496a','#a80b41','#e95674','#b5204b','#f6627f','#c22f55','#ff6e8a','#cf3d5f','#ff7a95'];
const DASHES=['0','6 3','2 3','9 3 2 3','1 3','6 3 2 3','2 5','9 3','4 2','1 5'];

</script>
<script type="text/babel">
const {useState,useMemo,useEffect,useRef}=React;
const {LineChart,Line,BarChart,Bar,PieChart,Pie,Cell,XAxis,YAxis,CartesianGrid,Tooltip,Legend,ResponsiveContainer,LabelList,ReferenceDot,ScatterChart,Scatter,ZAxis}=Recharts;

const fmtM=n=>`$${(n/1e6).toFixed(1)}M`;
const fmtK=n=>n>=1e6?`${(n/1e6).toFixed(1)}M`:n>=1e3?`${(n/1e3).toFixed(0)}K`:String(n);
const fmtPct=n=>`${n.toFixed(1)}%`;

const OS_COLOR_MAP={'Fire TV':'#A5023D','Tizen':'#9C9160','Roku':'#6E6E6E','SmartCast':'#dc496a','Google TV':'#C7BD91','WebOS':'#4a7c8c','기타/미상':'#cfcfcf'};
const osColor=os=>OS_COLOR_MAP[os]||'#999999';

const MODEL_TABLE_COLUMNS=[
  {key:'brand',label:'Brand',sortable:false,align:'left'},
  {key:'retailer_sku',label:'Retailer SKU',sortable:false,align:'left'},
  {key:'model_number',label:'Model Number',sortable:false,align:'left'},
  {key:'units_sold',label:'Unit Sold',sortable:true,align:'right'},
  {key:'retail_sales',label:'Retail Sales',sortable:true,align:'right'},
  {key:'conversion_rate',label:'Conversion Rate',sortable:true,align:'right'},
  {key:'total_traffic',label:'Total Traffic',sortable:true,align:'right'},
  {key:'organic_traffic',label:'Organic Traffic',sortable:true,align:'right'},
  {key:'os',label:'O/S',sortable:false,align:'left'},
];
const fmtModelCell=(col,m)=>{
  if(col.key==='retail_sales') return '$'+Math.round(m.retail_sales).toLocaleString();
  if(col.key==='conversion_rate') return m.conversion_rate.toFixed(2)+'%';
  if(col.key==='units_sold'||col.key==='total_traffic'||col.key==='organic_traffic') return m[col.key].toLocaleString();
  return m[col.key];
};

function CustomOsPieTooltip({active,payload}){
  if(!active||!payload||!payload.length) return null;
  const d=payload[0];
  return(
    <div className="ctt">
      <div className="ctt-item">
        <div className="ctt-dot" style={{background:d.payload.fill}}/>
        <span className="ctt-name">{d.name}</span>
        <span className="ctt-val">{fmtK(d.value)}</span>
      </div>
      <div style={{color:'var(--c-gray-dark)',marginTop:4}}>{fmtPct(d.payload.pct)} share</div>
    </div>
  );
}

function pearson(xs,ys){
  const n=xs.length;
  if(n<3) return null;
  const mx=xs.reduce((a,b)=>a+b,0)/n, my=ys.reduce((a,b)=>a+b,0)/n;
  let num=0,dx2=0,dy2=0;
  for(let i=0;i<n;i++){ const dx=xs[i]-mx, dy=ys[i]-my; num+=dx*dy; dx2+=dx*dx; dy2+=dy*dy; }
  const den=Math.sqrt(dx2*dy2);
  return den?num/den:0;
}
function corrDesc(r){
  const abs=Math.abs(r);
  const strength=abs>=0.7?'강한':abs>=0.4?'뚜렷한':abs>=0.2?'약한':'거의 없는';
  const dir=r>=0?'양':'음';
  return {strength,dir,abs};
}
const T_CRIT_05={1:12.706,2:4.303,3:3.182,4:2.776,5:2.571,6:2.447,7:2.365,8:2.306,9:2.262,10:2.228};
function corrSignificant(r,n){
  if(r==null||n<3) return false;
  const df=n-2;
  if(df<1) return false;
  if(Math.abs(r)>=0.999) return true;
  const t=Math.abs(r)*Math.sqrt(df/(1-r*r));
  const crit=T_CRIT_05[df]||1.96;
  return t>crit;
}

function extremeBarLabel(data,formatter){
  return (props)=>{
    const {x,y,width,height,value,index}=props;
    if(index!==0 && index!==data.length-1) return null;
    const cy=y+height/2;
    return (
      <text x={x+width+6} y={cy} dy={4} fontSize={11} fontWeight={700} fill="var(--c-brown)" textAnchor="start">
        {formatter(value)}
      </text>
    );
  };
}

function weekToLabel(w){
  const yr=Math.floor(w/100);
  const wk=w%100;
  const mo=Math.min(Math.ceil(wk/4.33),12);
  const ms=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${String(yr).slice(2)}-${ms[mo-1]}`;
}

function weekInRange(wk,weekFrom,weekTo){
  if(weekFrom==='all') return true;
  const from=parseInt(weekFrom), to=weekTo==='all'?from:parseInt(weekTo);
  return wk>=from && wk<=to;
}

function fmtPeriodLabel(period,weekFrom,weekTo){
  if(period==='all') return '전체 기간';
  if(weekFrom==='all') return `${period}년`;
  if(weekTo==='all'||weekTo===weekFrom) return `${period}년 ${weekFrom}주차`;
  return `${period}년 ${weekFrom}~${weekTo}주차`;
}

function buildTrendData(weekly, selectedBrands, period, weekFrom, weekTo){
  const map={};
  for(const row of weekly){
    const {week:wk,brand:b,rev,units,traffic,organic}=row;
    const yr=Math.floor(wk/100);
    if(period!=='all' && yr!==parseInt(period)) continue;
    if(period!=='all' && !weekInRange(wk%100,weekFrom,weekTo)) continue;
    if(!selectedBrands.includes(b)) continue;
    const key=weekToLabel(wk);
    if(!map[key]) map[key]={label:key,_wk:wk};
    map[key][b]=(map[key][b]||0)+rev;
    map[key][b+'_u']=(map[key][b+'_u']||0)+units;
    map[key][b+'_t']=(map[key][b+'_t']||0)+(traffic||0);
    map[key][b+'_o']=(map[key][b+'_o']||0)+(organic||0);
  }
  return Object.values(map).sort((a,b)=>a._wk-b._wk);
}

function CustomTooltip({active,payload,label,metric}){
  if(!active||!payload||!payload.length) return null;
  const items=[...payload].sort((a,b)=>b.value-a.value);
  return (
    <div className="ctt">
      <div className="ctt-label">{label}</div>
      {items.map(p=>(
        <div key={p.name} className="ctt-item">
          <div className="ctt-dot" style={{background:p.color}}/>
          <span className="ctt-name">{p.name}</span>
          <span className="ctt-val">{metric==='rev'?fmtM(p.value):fmtK(p.value)}</span>
        </div>
      ))}
    </div>
  );
}

function BarLegend({data}){
  return (
    <div style={{display:'flex',flexWrap:'wrap',justifyContent:'center',gap:'4px 12px',marginTop:10,paddingTop:10,borderTop:'1px solid var(--c-gray-light)'}}>
      {data.map((d,i)=>(
        <div key={d.brand||d.name||i} style={{display:'flex',alignItems:'center',gap:5}}>
          <div style={{width:8,height:8,borderRadius:'50%',background:d.color||d.fill,flexShrink:0}}/>
          <span style={{fontSize:11,color:'var(--c-gray-dark)'}}>{d.brand||d.name}</span>
        </div>
      ))}
    </div>
  );
}

function CustomPieTooltip({active,payload}){
  if(!active||!payload||!payload.length) return null;
  const d=payload[0];
  return(
    <div className="ctt">
      <div className="ctt-item">
        <div className="ctt-dot" style={{background:d.payload.fill}}/>
        <span className="ctt-name">{d.name}</span>
        <span className="ctt-val">{fmtM(d.value)}</span>
      </div>
      <div style={{color:'var(--c-gray-dark)',marginTop:4}}>{fmtPct(d.payload.pct)} share</div>
    </div>
  );

const SUGGESTED_QUESTIONS=[
  '브랜드별 매출과 전환율을 표로 비교해줘',
  '최근 3개월간 삼성과 LG의 매출 추이를 차트로 보여줘',
  '전환율이 가장 낮은 브랜드는 어디이고, 개선하려면 어떤 점을 봐야 할까?',
];

const CHAT_CHART_COLORS=['#A5023D','#9C9160','#C7BD91','#6E6E6E','#dc496a'];

function renderHighlighted(text){
  if(!text) return text;
  return String(text).split(/(\*\*.+?\*\*)/g).map((part,i)=>{
    const m=part.match(/^\*\*(.+)\*\*$/);
    return m ? <span key={i} className="hl">{m[1]}</span> : part;
  });
}

function flattenBlocks(blocks){
  return blocks.map(b=>{
    if(b.type==='table'){
      const head=b.headers.join(' | ');
      const rows=b.rows.map(r=>r.join(' | ')).join('\n');
      return (b.title?b.title+'\n':'')+head+'\n'+rows;
    }
    if(b.type==='chart'){
      return b.title||'차트';
    }
    return b.content||'';
  }).join('\n\n');
}

        <polyline points="15 3 21 3 21 9"/>

function ChatBlocks({blocks}){
  return (
    <>
      {blocks.map((b,i)=>{
        if(b.type==='table'){
          return (
            <div key={i} style={{margin:i===0?'0 0 6px':'6px 0',overflowX:'auto'}}>
              {b.title && <div style={{fontSize:11,fontWeight:700,color:'var(--c-olive)',marginBottom:4}}>{b.title}<SourceIcon url={b.source}/></div>}
              <table style={{borderCollapse:'collapse',fontSize:11,width:'100%'}}>
                <thead>
                  <tr>{b.headers.map((h,hi)=><th key={hi} style={{textAlign:'left',padding:'4px 8px',borderBottom:'1px solid var(--c-gray-light)',color:'var(--c-gray-dark)',whiteSpace:'nowrap'}}>{h}</th>)}</tr>
                </thead>
                <tbody>
                  {b.rows.map((row,ri)=>(
                    <tr key={ri}>{row.map((c,ci)=><td key={ci} style={{padding:'4px 8px',borderBottom:'1px solid var(--c-gray-light)',whiteSpace:'nowrap'}}>{renderHighlighted(c)}</td>)}</tr>
                  ))}
                </tbody>
              </table>
              {!b.title && <SourceIcon url={b.source}/>}
            </div>
          );
        }
        if(b.type==='chart'){
          const series=(b.series&&b.series.length)?b.series:[{key:'value',name:'값'}];
          return (
            <div key={i} style={{margin:i===0?'0 0 6px':'6px 0'}}>
              {b.title && <div style={{fontSize:11,fontWeight:700,color:'var(--c-olive)',marginBottom:4}}>{b.title}<SourceIcon url={b.source}/></div>}
              {!b.title && <SourceIcon url={b.source}/>}
              <ResponsiveContainer width="100%" height={180}>
                {b.chartType==='line'?(
                  <LineChart data={b.data} margin={{top:5,right:10,left:0,bottom:5}}>
                    <CartesianGrid strokeDasharray="3 3" stroke="#EAEAEA"/>
                    <XAxis dataKey={b.xKey||'label'} tick={{fontSize:10,fill:'#6E6E6E'}} axisLine={false} tickLine={false}/>
                    <YAxis tick={{fontSize:10,fill:'#6E6E6E'}} axisLine={false} tickLine={false} width={40}/>
                    <Tooltip contentStyle={{fontSize:11}}/>
                    {series.length>1 && <Legend wrapperStyle={{fontSize:10}}/>}
                    {series.map((s,si)=><Line key={s.key} type="monotone" dataKey={s.key} name={s.name||s.key} stroke={CHAT_CHART_COLORS[si%CHAT_CHART_COLORS.length]} strokeWidth={2} dot={{r:2}}/>)}
                  </LineChart>
                ):(
                  <BarChart data={b.data} margin={{top:5,right:10,left:0,bottom:5}}>
                    <CartesianGrid strokeDasharray="3 3" stroke="#EAEAEA"/>
                    <XAxis dataKey={b.xKey||'label'} tick={{fontSize:10,fill:'#6E6E6E'}} axisLine={false} tickLine={false}/>
                    <YAxis tick={{fontSize:10,fill:'#6E6E6E'}} axisLine={false} tickLine={false} width={40}/>
                    <Tooltip contentStyle={{fontSize:11}}/>
                    {series.length>1 && <Legend wrapperStyle={{fontSize:10}}/>}
                    {series.map((s,si)=><Bar key={s.key} dataKey={s.key} name={s.name||s.key} fill={CHAT_CHART_COLORS[si%CHAT_CHART_COLORS.length]}/>)}
                  </BarChart>
                )}
              </ResponsiveContainer>
            </div>
          );
        }
        return <div key={i} style={{whiteSpace:'pre-wrap',margin:i===0?0:'6px 0 0'}}>{renderHighlighted(b.content)}<SourceIcon url={b.source}/></div>;
      })}
    </>
  );
}

function ChatPanel({onClose}){
  const [messages,setMessages]=useState([]);
  const [input,setInput]=useState('');
  const [sending,setSending]=useState(false);
  const [stageIdx,setStageIdx]=useState(0);
  const [suggestions,setSuggestions]=useState(SUGGESTED_QUESTIONS);
  const bottomRef=useRef(null);
  const stageTimerRef=useRef(null);

  useEffect(()=>{
    bottomRef.current?.scrollIntoView({behavior:'smooth'});
  },[messages,sending,stageIdx]);

  useEffect(()=>()=>clearInterval(stageTimerRef.current),[]);

  const sendText=(text)=>{
    if(!text||sending) return;
    const history=messages.slice(-10).map(m=>({role:m.role,content:m.content}));
    setMessages(prev=>[...prev,{role:'user',content:text}]);
    setInput('');
    setSending(true);
    setStageIdx(0);
    stageTimerRef.current=setInterval(()=>{
      setStageIdx(i=>Math.min(i+1,CHAT_STAGES.length-1));
    },1600);
    fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:text,history}),
    }).then(r=>{
      if(!r.ok) throw new Error('서버 오류 ('+r.status+')');
      return r.json();
    }).then(data=>{
      const blocks=Array.isArray(data.blocks)&&data.blocks.length?data.blocks:[{type:'text',content:'답변을 생성하지 못했습니다.'}];
      setMessages(prev=>[...prev,{role:'assistant',content:flattenBlocks(blocks),blocks}]);
      if(Array.isArray(data.suggestions)&&data.suggestions.length) setSuggestions(data.suggestions);
    }).catch(e=>{
      setMessages(prev=>[...prev,{role:'assistant',content:'답변을 가져오지 못했습니다: '+e.message,error:true}]);
    }).finally(()=>{
      clearInterval(stageTimerRef.current);
      setSending(false);
    });
  };

  const send=()=>sendText(input.trim());

  const onKeyDown=e=>{
    if(e.key==='Enter'&&!e.shiftKey){
      e.preventDefault();
      send();
    }
  };

  return (
    <>
      <div className="chat-header">
        Insight Finder
        <button className="chat-close-btn" onClick={onClose} aria-label="닫기">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      {messages.length===0 && (
        <div className="chat-empty-hint">
          왼쪽 대시보드 데이터에 대해 질문해 보세요. 아래 추천 질문을 눌러보거나 직접 입력할 수 있어요.
        </div>
      )}
      <div className="chat-messages">
        {messages.map((m,i)=>(
          <div key={i} className={"chat-msg "+(m.role==='user'?'user':m.error?'error':'bot')}>
            {m.role==='assistant'&&m.blocks?<ChatBlocks blocks={m.blocks}/>:m.content}
          </div>
        ))}
        {sending && <div className="chat-msg pending">{CHAT_STAGES[stageIdx]}</div>}
        <div ref={bottomRef}/>
      </div>
      <div className="chat-suggestions">
        {suggestions.map((q,i)=>(
          <button key={i} className="chat-suggestion-chip" onClick={()=>sendText(q)} disabled={sending}>{q}</button>
        ))}
      </div>
      <div className="chat-input-row">
        <textarea className="chat-input" rows={2} value={input}
          onChange={e=>setInput(e.target.value)}
          onKeyDown={onKeyDown}
          placeholder="질문을 입력하세요..."/>
        <button className="chat-send-btn" onClick={send} disabled={sending||!input.trim()}>전송</button>
      </div>
    </>
  );
}

}

      if(!r.ok) throw new Error(data.detail||'변경에 실패했습니다.');
      return data;
    }).then(()=>{
      setMsg('비밀번호가 변경되었습니다.');
      setCurrentPassword(''); setNewPassword('');
    }).catch(e=>setError(e.message));
  };

  return (
    <div className="backoffice-page">
      <div className="backoffice-card" style={{maxWidth:420}}>
        <div className="backoffice-header">
          <div className="backoffice-title">정보변경</div>
          <div style={{display:'flex',gap:8}}>
            <button className="header-action-btn" onClick={onBack}>대시보드로</button>
            <button className="header-action-btn" onClick={onLogout}>Logout</button>
          </div>
        </div>
        <div className="bo-field"><label>이름</label><div>{user.name}</div></div>
        <div className="bo-field"><label>ID</label><div>{user.email}</div></div>
        <div className="bo-field"><label>가입일시</label><div>{fmtDateTime(user.created_at)}</div></div>
        <form onSubmit={submit} style={{marginTop:8,borderTop:'1px solid var(--c-gray-light)',paddingTop:16}}>
          <div className="bo-field"><label>현재 비밀번호</label><input type="password" value={currentPassword} onChange={e=>setCurrentPassword(e.target.value)}/></div>
          <div className="bo-field"><label>새 비밀번호</label><input type="password" value={newPassword} onChange={e=>setNewPassword(e.target.value)}/></div>
          {error && <div className="auth-error">{error}</div>}
          {msg && <div className="auth-msg">{msg}</div>}
          <button className="auth-btn" type="submit">비밀번호 변경</button>
        </form>
      </div>
    </div>
  );
}

function App(){
  const [authState,setAuthState]=useState('loading');
  const [user,setUser]=useState(null);
  const [view,setView]=useState('dashboard');

  useEffect(()=>{
    fetch('/api/auth/me').then(r=>{
      if(!r.ok) throw new Error('unauthenticated');
      return r.json();
    }).then(u=>{ setUser(u); setAuthState('app'); })
      .catch(()=>setAuthState('login'));
  },[]);

  const handleLogout=()=>{
    fetch('/api/auth/logout',{method:'POST'}).finally(()=>{
      setUser(null);
      setView('dashboard');
      setAuthState('login');
    });
  };

  if(authState==='loading') return <div style={{padding:40,color:'var(--c-gray-dark)'}}>로딩 중...</div>;
  if(authState==='login') return <LoginScreen onLogin={(u)=>{setUser(u);setAuthState('app');}} onGoSignup={()=>setAuthState('signup')}/>;
  if(authState==='signup') return <SignupScreen onDone={()=>setAuthState('login')} onBack={()=>setAuthState('login')}/>;

  if(view==='admin' && user.role==='admin'){
    return <AdminScreen onBack={()=>setView('dashboard')} onLogout={handleLogout}/>;
  }
  if(view==='profile'){
    return <ProfileScreen user={user} onBack={()=>setView('dashboard')} onLogout={handleLogout}/>;
  }
  return <Dashboard user={user} onLogout={handleLogout} onAdminClick={()=>setView(user.role==='admin'?'admin':'profile')}/>;
}

function Dashboard({user,onLogout,onAdminClick}){
  const [sel,setSel]=useState(new Set(BRANDS));
  const [period,setPeriod]=useState('all');
  const [weekFrom,setWeekFrom]=useState('all');
  const [weekTo,setWeekTo]=useState('all');
  const [metric,setMetric]=useState('rev');
  const [weekly,setWeekly]=useState(null);
  const [totals,setTotals]=useState(null);
  const [loadError,setLoadError]=useState(null);
  const [chatWidth,setChatWidth]=useState(360);
  const [mobileChatOpen,setMobileChatOpen]=useState(false);
  const [osShare,setOsShare]=useState(null);
  const [topModels,setTopModels]=useState(null);
  const [modelSort,setModelSort]=useState('units_sold');
  const [trafficMetric,setTrafficMetric]=useState('total');
  const draggingRef=useRef(false);

  useEffect(()=>{
    fetch(`/api/os_share?period=${period}&week_from=${weekFrom}&week_to=${weekTo}`).then(r=>r.json()).then(setOsShare).catch(()=>setOsShare([]));
  },[period,weekFrom,weekTo]);

  useEffect(()=>{
    fetch(`/api/top_models?period=${period}&week_from=${weekFrom}&week_to=${weekTo}&sort=${modelSort}`).then(r=>r.json()).then(setTopModels).catch(()=>setTopModels([]));
  },[period,weekFrom,weekTo,modelSort]);

  const osPieData=useMemo(()=>{
    if(!osShare) return [];
    const total=osShare.reduce((s,d)=>s+d.units,0);
    return osShare.map(d=>({name:d.os,value:d.units,pct:total?d.units/total*100:0,fill:osColor(d.os)}));
  },[osShare]);

  useEffect(()=>{
    const onMove=e=>{
      if(!draggingRef.current) return;
      const w=window.innerWidth-e.clientX;
      setChatWidth(Math.min(600,Math.max(280,w)));
    };
    const onUp=()=>{
      draggingRef.current=false;
      document.body.style.cursor='';
    };
    window.addEventListener('mousemove',onMove);
    window.addEventListener('mouseup',onUp);
    return ()=>{
      window.removeEventListener('mousemove',onMove);
      window.removeEventListener('mouseup',onUp);
    };
  },[]);

  const onHandleMouseDown=e=>{
    e.preventDefault();
    draggingRef.current=true;
    document.body.style.cursor='col-resize';
  };

  useEffect(()=>{
    Promise.all([
      fetch('/api/weekly').then(r=>{if(!r.ok) throw new Error('weekly '+r.status); return r.json();}),
      fetch('/api/totals').then(r=>{if(!r.ok) throw new Error('totals '+r.status); return r.json();}),
    ]).then(([w,t])=>{setWeekly(w);setTotals(t);})
      .catch(e=>setLoadError(e.message));
  },[]);

  const toggle=b=>setSel(prev=>{
    const n=new Set(prev);
    if(n.has(b)){if(n.size>1)n.delete(b);}else n.add(b);
    return n;
  });

  const allSelected=sel.size===BRANDS.length;
  const toggleAll=()=>setSel(allSelected?new Set():new Set(BRANDS));

  const availableYears=useMemo(()=>{
    if(!weekly) return [];
    return [...new Set(weekly.map(r=>Math.floor(r.week/100)))].sort();
  },[weekly]);

  const availableWeeks=useMemo(()=>{
    if(!weekly||period==='all') return [];
    const yr=parseInt(period);
    return [...new Set(weekly.filter(r=>Math.floor(r.week/100)===yr).map(r=>r.week%100))].sort((a,b)=>a-b);
  },[weekly,period]);

  const onYearChange=y=>{
    setPeriod(y);
    setWeekFrom('all');
    setWeekTo('all');
  };

  const onWeekFromChange=v=>{
    setWeekFrom(v);
    if(v==='all'){
      setWeekTo('all');
    }else{
      setWeekTo(prev=>(prev==='all'||parseInt(prev)<parseInt(v))?v:prev);
    }
  };

  const weekToOptions=useMemo(()=>{
    if(weekFrom==='all') return [];
    return availableWeeks.filter(w=>w>=parseInt(weekFrom));
  },[availableWeeks,weekFrom]);

  const filteredTotals=useMemo(()=>{
    if(!weekly||!totals) return [];
    if(period==='all') return totals.filter(t=>sel.has(t.brand));
    const byBrand={};
    for(const row of weekly){
      const {week:wk,brand:b,rev,units,traffic,organic}=row;
      const yr=Math.floor(wk/100);
      if(yr!==parseInt(period)) continue;
      if(!weekInRange(wk%100,weekFrom,weekTo)) continue;
      if(!sel.has(b)) continue;
      if(!byBrand[b]) byBrand[b]={brand:b,rev:0,units:0,traffic:0,organic:0,conv:0};
      byBrand[b].rev+=rev;
      byBrand[b].units+=units;
      byBrand[b].traffic+=traffic;
      byBrand[b].organic+=(organic||0);
    }
    return Object.values(byBrand).map(t=>({...t,conv:t.traffic?t.units/t.traffic*100:0}));
  },[weekly,totals,sel,period,weekFrom,weekTo]);

  const totalRev=filteredTotals.reduce((s,t)=>s+t.rev,0);
  const totalUnits=filteredTotals.reduce((s,t)=>s+t.units,0);

  const pieData=useMemo(()=>{
    const sorted=[...filteredTotals].sort((a,b)=>b[metric==='rev'?'rev':'units']-a[metric==='rev'?'rev':'units']);
    const val=metric==='rev'?'rev':'units';
    const total=sorted.reduce((s,t)=>s+t[val],0);
    return sorted.map(t=>({name:t.brand,value:t[val],pct:total?t[val]/total*100:0,fill:COLORS[BRANDS.indexOf(t.brand)]}));
  },[filteredTotals,metric]);

  const barData=useMemo(()=>{
    return [...filteredTotals].sort((a,b)=>b[metric==='rev'?'rev':'units']-a[metric==='rev'?'rev':'units'])
      .map(t=>({brand:t.brand,value:t[metric==='rev'?'rev':'units'],color:COLORS[BRANDS.indexOf(t.brand)]}));
  },[filteredTotals,metric]);

  const trendData=useMemo(()=>weekly?buildTrendData(weekly,[...sel],period,weekFrom,weekTo):[],[weekly,sel,period,weekFrom,weekTo]);
  const selLegendData=useMemo(()=>[...sel].map(b=>({brand:b,color:COLORS[BRANDS.indexOf(b)]})),[sel]);

  const trendPeak=useMemo(()=>{
    if(!trendData.length) return null;
    let best=null;
    for(const row of trendData){
      let sum=0;
      for(const b of sel){ sum+=row[metric==='rev'?b:b+'_u']||0; }
      if(!best||sum>best.sum) best={label:row.label,sum};
    }
    return best;
  },[trendData,sel,metric]);

  const trendGlobalMax=useMemo(()=>{
    if(!trendData.length) return null;
    let best=null;
    for(const row of trendData){
      for(const b of sel){
        const key=metric==='rev'?b:b+'_u';
        const v=row[key];
        if(v==null) continue;
        if(!best||v>best.value) best={label:row.label,value:v,brand:b};
      }
    }
    return best;
  },[trendData,sel,metric]);

  const trafficSuffix=trafficMetric==='total'?'_t':'_o';

  const trafficTrendPeak=useMemo(()=>{
    if(!trendData.length) return null;
    let best=null;
    for(const row of trendData){
      let sum=0;
      for(const b of sel){ sum+=row[b+trafficSuffix]||0; }
      if(!best||sum>best.sum) best={label:row.label,sum};
    }
    return best;
  },[trendData,sel,trafficSuffix]);

  const trafficTrendGlobalMax=useMemo(()=>{
    if(!trendData.length) return null;
    let best=null;
    for(const row of trendData){
      for(const b of sel){
        const v=row[b+trafficSuffix];
        if(v==null) continue;
        if(!best||v>best.value) best={label:row.label,value:v,brand:b};
      }
    }
    return best;
  },[trendData,sel,trafficSuffix]);

  const rankedByRev=useMemo(()=>[...filteredTotals].sort((a,b)=>b.rev-a.rev),[filteredTotals]);
  const topBrand=rankedByRev[0]||null;
  const secondBrand=rankedByRev[1]||null;
  const gapRev=(topBrand&&secondBrand)?topBrand.rev-secondBrand.rev:0;
  const allTotals=(totals||[]).filter(t=>sel.has(t.brand));
  const avgConv=allTotals.length?allTotals.reduce((s,t)=>s+t.conv,0)/allTotals.length:0;

  const trendKey=metric==='rev'?'rev':'_u';

  const yoy=useMemo(()=>{
    if(!weekly) return null;
    const years=[...new Set(weekly.map(r=>Math.floor(r.week/100)))];
    const maxYear=Math.max(...years);
    const curYear=period==='all'?maxYear:parseInt(period);
    const priorYear=curYear-1;
    if(!years.includes(priorYear)) return null;
    let curWeekNos;
    if(period!=='all'&&weekFrom!=='all'){
      const from=parseInt(weekFrom), to=weekTo==='all'?from:parseInt(weekTo);
      curWeekNos=new Set();
      for(let w=from;w<=to;w++) curWeekNos.add(w);
    }else{
      curWeekNos=new Set(weekly.filter(r=>Math.floor(r.week/100)===curYear).map(r=>r.week%100));
    }
    const sums=yr=>{
      let rev=0,units=0,traffic=0;
      for(const r of weekly){
        if(Math.floor(r.week/100)!==yr) continue;
        if(!curWeekNos.has(r.week%100)) continue;
        if(!sel.has(r.brand)) continue;
        rev+=r.rev; units+=r.units; traffic+=r.traffic;
      }
      return {rev,units,traffic,conv:traffic?units/traffic*100:0};
    };
    const cur=sums(curYear), prior=sums(priorYear);
    if(!prior.rev&&!prior.units) return null;
    return {
      curYear,priorYear,
      revPct:prior.rev?(cur.rev-prior.rev)/prior.rev*100:null,
      unitsPct:prior.units?(cur.units-prior.units)/prior.units*100:null,
      convDelta:cur.conv-prior.conv,
    };
  },[weekly,sel,period,weekFrom,weekTo]);

  const mom=useMemo(()=>{
    if(!weekly) return null;
    const monthMap={};
    for(const r of weekly){
      const yr=Math.floor(r.week/100);
      if(period!=='all'&&yr!==parseInt(period)) continue;
      if(period!=='all'&&!weekInRange(r.week%100,weekFrom,weekTo)) continue;
      if(!sel.has(r.brand)) continue;
      const wk=r.week%100;
      const mo=Math.min(Math.ceil(wk/4.33),12);
      const key=yr*100+mo;
      if(!monthMap[key]) monthMap[key]={rev:0,units:0,traffic:0};
      monthMap[key].rev+=r.rev;
      monthMap[key].units+=r.units;
      monthMap[key].traffic+=r.traffic;
    }
    const keys=Object.keys(monthMap).map(Number).sort((a,b)=>a-b);
    if(keys.length<2) return null;
    const cur=monthMap[keys[keys.length-1]], prior=monthMap[keys[keys.length-2]];
    const convCur=cur.traffic?cur.units/cur.traffic*100:0;
    const convPrior=prior.traffic?prior.units/prior.traffic*100:0;
    return {
      revPct:prior.rev?(cur.rev-prior.rev)/prior.rev*100:null,
      unitsPct:prior.units?(cur.units-prior.units)/prior.units*100:null,
      convDelta:convCur-convPrior,
    };
  },[weekly,sel,period,weekFrom,weekTo]);

  const convBarData=useMemo(()=>{
    return [...filteredTotals]
      .sort((a,b)=>b.conv-a.conv)
      .map(t=>({brand:t.brand,conv:t.conv||0,traffic:t.traffic||0,color:COLORS[BRANDS.indexOf(t.brand)]}));
  },[filteredTotals]);

  const trafficBarData=useMemo(()=>[...convBarData].sort((a,b)=>b.traffic-a.traffic),[convBarData]);

  const revConvData=useMemo(()=>{
    return [...filteredTotals].sort((a,b)=>b.rev-a.rev)
      .map(t=>({brand:t.brand,rev:t.rev,conv:t.conv||0,color:COLORS[BRANDS.indexOf(t.brand)]}));
  },[filteredTotals]);

  const trafficRevData=useMemo(()=>{
    return [...filteredTotals].sort((a,b)=>b.traffic-a.traffic)
      .map(t=>({brand:t.brand,traffic:t.traffic,rev:t.rev||0,color:COLORS[BRANDS.indexOf(t.brand)]}));
  },[filteredTotals]);

  const organicConvData=useMemo(()=>{
    return [...filteredTotals]
      .sort((a,b)=>b.conv-a.conv)
      .map(t=>({brand:t.brand,conv:t.conv||0,organic:t.organic||0,color:COLORS[BRANDS.indexOf(t.brand)]}));
  },[filteredTotals]);

  const organicRevData=useMemo(()=>{
    return [...filteredTotals].sort((a,b)=>b.organic-a.organic)
      .map(t=>({brand:t.brand,organic:t.organic||0,rev:t.rev||0,color:COLORS[BRANDS.indexOf(t.brand)]}));
  },[filteredTotals]);

  const insights=useMemo(()=>{
    if(!filteredTotals.length) return null;
    const byRev=[...filteredTotals].sort((a,b)=>b.rev-a.rev);
    const byConv=[...filteredTotals].sort((a,b)=>b.conv-a.conv);
    const byTraffic=[...filteredTotals].sort((a,b)=>b.traffic-a.traffic);
    const top=byRev[0], second=byRev[1]||null, bottom=byRev[byRev.length-1];
    const totalRevSel=filteredTotals.reduce((s,t)=>s+t.rev,0);
    const top3=byRev.slice(0,Math.min(3,byRev.length));
    const top3Pct=totalRevSel?top3.reduce((s,t)=>s+t.rev,0)/totalRevSel*100:0;
    const topSharePct=totalRevSel?top.rev/totalRevSel*100:0;
    const avgConvSel=filteredTotals.reduce((s,t)=>s+t.conv,0)/filteredTotals.length;
    const avgTrafficSel=filteredTotals.reduce((s,t)=>s+t.traffic,0)/filteredTotals.length;
    const convTop=byConv[0], convBottom=byConv[byConv.length-1];
    const trafficTop=byTraffic[0];
    const inefficient=byTraffic.filter(t=>t.traffic>=avgTrafficSel&&t.conv<avgConvSel).sort((a,b)=>b.traffic-a.traffic)[0]||null;
    const periodLabel=fmtPeriodLabel(period,weekFrom,weekTo);

    const revs=filteredTotals.map(t=>t.rev), traffics=filteredTotals.map(t=>t.traffic),
      convs=filteredTotals.map(t=>t.conv), units=filteredTotals.map(t=>t.units),
      organics=filteredTotals.map(t=>t.organic||0);
    const n=filteredTotals.length;
    const corrRevTraffic=pearson(revs,traffics);
    const corrTrafficConv=pearson(traffics,convs);
    const corrRevConv=pearson(revs,convs);
    const corrUnitsTraffic=pearson(units,traffics);
    const corrOrganicConv=pearson(organics,convs);
    const corrOrganicRev=pearson(organics,revs);
    const sigRevTraffic=corrSignificant(corrRevTraffic,n);
    const sigTrafficConv=corrSignificant(corrTrafficConv,n);
    const sigRevConv=corrSignificant(corrRevConv,n);
    const sigUnitsTraffic=corrSignificant(corrUnitsTraffic,n);
    const sigOrganicConv=corrSignificant(corrOrganicConv,n);
    const sigOrganicRev=corrSignificant(corrOrganicRev,n);

    return {periodLabel,count:filteredTotals.length,top,second,bottom,top3,top3Pct,topSharePct,
      avgConvSel,avgTrafficSel,convTop,convBottom,trafficTop,inefficient,totalRevSel,
      corrRevTraffic,corrTrafficConv,corrRevConv,corrUnitsTraffic,corrOrganicConv,corrOrganicRev,
      sigRevTraffic,sigTrafficConv,sigRevConv,sigUnitsTraffic,sigOrganicConv,sigOrganicRev};
  },[filteredTotals,period,weekFrom,weekTo]);

  if(loadError){
    return <div style={{padding:40,color:'var(--c-red)'}}>데이터 로딩 실패: {loadError}. API 서버(uvicorn server.main:app)가 실행 중인지 확인하세요.</div>;
  }
  if(!weekly||!totals){
    return <div style={{padding:40,color:'var(--c-gray-dark)'}}>데이터를 불러오는 중...</div>;
  }

  return (
    <div className="app-shell">
    <div className="dashboard-col">
      <div className="header">
        <img className="header-badge" src="/static/LG%20Logo.jpg" alt="LG"/>
        <div>
          <h1>US TV Market — Brand Competition Dashboard</h1>
          <p>Amazon.com | TV Category | Weekly Data | Week 202401–202605</p>
        </div>
        <div className="header-actions">
          <button className="header-action-btn" onClick={onAdminClick}>{user.role==='admin'?'Admin':'정보변경'}</button>
          <button className="header-action-btn" onClick={onLogout}>Logout</button>
        </div>
      </div>

      <div className="filters">
        <div className="filter-group">
          <div className="filter-label">연도 선택</div>
          <select className="filter-select" value={period} onChange={e=>onYearChange(e.target.value)}>
            <option value="all">전체</option>
            {availableYears.map(y=><option key={y} value={y}>{y}년</option>)}
          </select>
        </div>
        <div className="filter-group">
          <div className="filter-label">주차선택(From~To)</div>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <select className="filter-select" value={weekFrom} onChange={e=>onWeekFromChange(e.target.value)} disabled={period==='all'}>
              <option value="all">전체</option>
              {availableWeeks.map(w=><option key={w} value={w}>{w}주차</option>)}
            </select>
            <span style={{color:'var(--c-gray-dark)',fontWeight:600}}>~</span>
            <select className="filter-select" value={weekTo} onChange={e=>setWeekTo(e.target.value)} disabled={period==='all'||weekFrom==='all'}>
              {weekFrom==='all'
                ?<option value="all">전체</option>
                :weekToOptions.map(w=><option key={w} value={w}>{w}주차</option>)}
            </select>
          </div>
        </div>
        <div className="filter-group">
          <div className="filter-label">브랜드 선택 (클릭으로 토글)</div>
          <div className="brand-pills">
            <div className="select-all-pill" onClick={toggleAll}>{allSelected?'전체해제':'전체선택'}</div>
            {BRANDS.map((b,i)=>(
              <div key={b}
                className={`brand-pill ${sel.has(b)?'active':''}`}
                style={{borderColor:COLORS[i],color:COLORS[i],background:sel.has(b)?COLORS[i]+'22':'transparent'}}
                onClick={()=>toggle(b)}
              >{b}</div>
            ))}
          </div>
        </div>
      </div>

      {insights && (
        <div className="chart-card" style={{marginBottom:16}}>
          <div className="chart-header">
            <div>
              <div className="insight-summary-badge">Dashboard Summary</div>
              <div className="chart-subtitle" style={{marginLeft:0,marginTop:6}}>{insights.periodLabel} · 선택 브랜드 {insights.count}개 기준 자동 생성</div>
            </div>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            <div className="insight-item">
              <span className="hl">{insights.top.brand}</span>가 매출 <span className="hl">{fmtM(insights.top.rev)}</span>(점유율 <span className="hl">{fmtPct(insights.topSharePct)}</span>)로 1위이며{insights.second?<>, 2위 <span className="hl">{insights.second.brand}</span>(<span className="hl">{fmtM(insights.second.rev)}</span>)와의 격차는 <span className="hl">{fmtM(insights.top.rev-insights.second.rev)}</span></>:''}입니다.
            </div>
            <div className="insight-item">
              상위 {insights.top3.length}개 브랜드({insights.top3.map(t=>t.brand).join(', ')})가 전체 매출의 <span className="hl">{fmtPct(insights.top3Pct)}</span>를 차지해, {insights.top3Pct>=70?'시장 집중도가 높은 편입니다':'비교적 고르게 분산되어 있습니다'} (선택 {insights.count}개 브랜드 총매출 <span className="hl">{fmtM(insights.totalRevSel)}</span> 기준).
            </div>
            <div className="insight-item">

              </div>

          </div>
          <ResponsiveContainer width="100%" height={320}>
            <ScatterChart margin={{left:20,right:30,top:20,bottom:20}}>
              <CartesianGrid strokeDasharray="3 3" stroke="#EAEAEA"/>
              <XAxis type="number" dataKey="traffic" name="Total Traffic" tickFormatter={fmtK} tick={{fill:'#6E6E6E',fontSize:11}} axisLine={false} tickLine={false}
                label={{value:'Total Traffic',position:'insideBottom',offset:-8,fontSize:11,fill:'#6E6E6E'}}/>
              <YAxis type="number" dataKey="conv" name="Conversion Rate" tickFormatter={v=>v+'%'} tick={{fill:'#6E6E6E',fontSize:11}} axisLine={false} tickLine={false}
                label={{value:'Conversion Rate',angle:-90,position:'insideLeft',fontSize:11,fill:'#6E6E6E'}}/>
              <Tooltip content={<CustomScatterTooltip xKey="traffic" xLabel="Traffic" xFmt={fmtK}/>} cursor={{strokeDasharray:'3 3'}}/>
              <Scatter data={convBarData}>
                {convBarData.map(d=><Cell key={d.brand} fill={d.color}/>)}
                <LabelList dataKey="brand" position="top" style={{fontSize:11,fontWeight:600,fill:'var(--c-brown)'}}/>
              </Scatter>
            </ScatterChart>
          </ResponsiveContainer>
          <BarLegend data={convBarData}/>
        </div>

        <div className="chart-card">
          <div className="chart-header" style={{flexDirection:'column',alignItems:'stretch'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
              <div>
                <div className="chart-title"><span className="num-badge">12</span>브랜드별 Organic Traffic 대비 전환율 분석</div>
                <div className="chart-subtitle">{fmtPeriodLabel(period,weekFrom,weekTo)} 기준 · X축 Organic 트래픽, Y축 전환율</div>
              </div>
              {insights && <CorrBadge r={insights.corrOrganicConv}/>}
            </div>
            {insights && (
              <div className="chart-header-insight" style={{marginTop:8,minHeight:36}}>
                {insights.sigOrganicConv?(()=>{const c=corrDesc(insights.corrOrganicConv); return <>Organic 트래픽과 전환율 간에는 <span className="hl">{c.strength} {c.dir}의 상관관계</span>(상관계수 <span className="hl">{insights.corrOrganicConv.toFixed(2)}</span>)가 있어, {c.dir==='양'?'Organic 트래픽이 많을수록 전환율도 높아지는 경향이 있습니다':'Organic 트래픽이 많다고 전환율이 높은 것은 아닙니다'}.</>;})():<>Organic 트래픽과 전환율 간에 뚜렷한 상관관계는 보이지 않아, 브랜드별 효율 편차가 큽니다.</>}
              </div>
            )}
          </div>
          <ResponsiveContainer width="100%" height={320}>
            <ScatterChart margin={{left:20,right:30,top:20,bottom:20}}>
              <CartesianGrid strokeDasharray="3 3" stroke="#EAEAEA"/>
              <XAxis type="number" dataKey="organic" name="Organic Traffic" tickFormatter={fmtK} tick={{fill:'#6E6E6E',fontSize:11}} axisLine={false} tickLine={false}
                label={{value:'Organic Traffic',position:'insideBottom',offset:-8,fontSize:11,fill:'#6E6E6E'}}/>
              <YAxis type="number" dataKey="conv" name="Conversion Rate" tickFormatter={v=>v+'%'} tick={{fill:'#6E6E6E',fontSize:11}} axisLine={false} tickLine={false}
                label={{value:'Conversion Rate',angle:-90,position:'insideLeft',fontSize:11,fill:'#6E6E6E'}}/>
              <Tooltip content={<CustomScatterTooltip xKey="organic" xLabel="Organic Traffic" xFmt={fmtK}/>} cursor={{strokeDasharray:'3 3'}}/>
              <Scatter data={organicConvData}>
                {organicConvData.map(d=><Cell key={d.brand} fill={d.color}/>)}
                <LabelList dataKey="brand" position="top" style={{fontSize:11,fontWeight:600,fill:'var(--c-brown)'}}/>
              </Scatter>
            </ScatterChart>
          </ResponsiveContainer>
          <BarLegend data={organicConvData}/>
        </div>
      </div>

      <div className="charts-grid-2">
        <div className="chart-card">
          <div className="chart-header" style={{flexDirection:'column',alignItems:'stretch'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
              <div>
                <div className="chart-title"><span className="num-badge">13</span>브랜드별 Total Traffic 대비 매출 분석</div>
                <div className="chart-subtitle">{fmtPeriodLabel(period,weekFrom,weekTo)} 기준 · X축 트래픽, Y축 매출</div>
              </div>
              {insights && <CorrBadge r={insights.corrRevTraffic}/>}
            </div>
            {insights && (
              <div className="chart-header-insight" style={{marginTop:8,minHeight:36}}>
                {insights.sigRevTraffic?(()=>{const c=corrDesc(insights.corrRevTraffic); return <>트래픽과 매출 간에는 <span className="hl">{c.strength} {c.dir}의 상관관계</span>(상관계수 <span className="hl">{insights.corrRevTraffic.toFixed(2)}</span>, p&lt;0.05)가 있어, {c.dir==='양'?'트래픽이 많은 브랜드일수록 매출도 높은 경향이 있습니다':'트래픽 규모와 매출이 반대로 움직이는 경향이 있습니다'}.</>;})():<>트래픽과 매출 간에 뚜렷한 상관관계는 보이지 않습니다.</>}
              </div>
            )}
          </div>
          <ResponsiveContainer width="100%" height={320}>
            <ScatterChart margin={{left:35,right:30,top:20,bottom:20}}>
              <CartesianGrid strokeDasharray="3 3" stroke="#EAEAEA"/>
              <XAxis type="number" dataKey="traffic" name="Total Traffic" tickFormatter={fmtK} tick={{fill:'#6E6E6E',fontSize:11}} axisLine={false} tickLine={false}
                label={{value:'Total Traffic',position:'insideBottom',offset:-8,fontSize:11,fill:'#6E6E6E'}}/>
              <YAxis type="number" dataKey="rev" name="Revenue" tickFormatter={fmtM} tick={{fill:'#6E6E6E',fontSize:11}} axisLine={false} tickLine={false}
                label={{value:'Revenue',angle:-90,position:'insideLeft',offset:-25,fontSize:11,fill:'#6E6E6E'}}/>
              <Tooltip content={<CustomScatterTooltip xKey="traffic" xLabel="Traffic" xFmt={fmtK} yKey="rev" yLabel="Revenue" yFmt={fmtM}/>} cursor={{strokeDasharray:'3 3'}}/>
              <Scatter data={trafficRevData}>
                {trafficRevData.map(d=><Cell key={d.brand} fill={d.color}/>)}
                <LabelList dataKey="brand" position="top" style={{fontSize:11,fontWeight:600,fill:'var(--c-brown)'}}/>
              </Scatter>
            </ScatterChart>
          </ResponsiveContainer>
          <BarLegend data={trafficRevData}/>
        </div>

        <div className="chart-card">
          <div className="chart-header" style={{flexDirection:'column',alignItems:'stretch'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
              <div>
                <div className="chart-title"><span className="num-badge">14</span>브랜드별 Organic Traffic 대비 매출 분석</div>
                <div className="chart-subtitle">{fmtPeriodLabel(period,weekFrom,weekTo)} 기준 · X축 Organic 트래픽, Y축 매출</div>
              </div>
              {insights && <CorrBadge r={insights.corrOrganicRev}/>}
            </div>
            {insights && (
              <div className="chart-header-insight" style={{marginTop:8,minHeight:36}}>
                {insights.sigOrganicRev?(()=>{const c=corrDesc(insights.corrOrganicRev); return <>Organic 트래픽과 매출 간에는 <span className="hl">{c.strength} {c.dir}의 상관관계</span>(상관계수 <span className="hl">{insights.corrOrganicRev.toFixed(2)}</span>, p&lt;0.05)가 있어, {c.dir==='양'?'Organic 트래픽이 많은 브랜드일수록 매출도 높은 경향이 있습니다':'Organic 트래픽 규모와 매출이 반대로 움직이는 경향이 있습니다'}.</>;})():<>Organic 트래픽과 매출 간에 뚜렷한 상관관계는 보이지 않습니다.</>}
              </div>
            )}
          </div>
          <ResponsiveContainer width="100%" height={320}>
            <ScatterChart margin={{left:35,right:30,top:20,bottom:20}}>
              <CartesianGrid strokeDasharray="3 3" stroke="#EAEAEA"/>
              <XAxis type="number" dataKey="organic" name="Organic Traffic" tickFormatter={fmtK} tick={{fill:'#6E6E6E',fontSize:11}} axisLine={false} tickLine={false}
                label={{value:'Organic Traffic',position:'insideBottom',offset:-8,fontSize:11,fill:'#6E6E6E'}}/>
              <YAxis type="number" dataKey="rev" name="Revenue" tickFormatter={fmtM} tick={{fill:'#6E6E6E',fontSize:11}} axisLine={false} tickLine={false}
                label={{value:'Revenue',angle:-90,position:'insideLeft',offset:-25,fontSize:11,fill:'#6E6E6E'}}/>
              <Tooltip content={<CustomScatterTooltip xKey="organic" xLabel="Organic Traffic" xFmt={fmtK} yKey="rev" yLabel="Revenue" yFmt={fmtM}/>} cursor={{strokeDasharray:'3 3'}}/>
              <Scatter data={organicRevData}>
                {organicRevData.map(d=><Cell key={d.brand} fill={d.color}/>)}
                <LabelList dataKey="brand" position="top" style={{fontSize:11,fontWeight:600,fill:'var(--c-brown)'}}/>
              </Scatter>
            </ScatterChart>
          </ResponsiveContainer>
          <BarLegend data={organicRevData}/>
        </div>
      </div>

      <div className="charts-grid-2">
        <div className="chart-card">
          <div className="chart-header" style={{flexDirection:'column',alignItems:'stretch'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
              <div>
                <div className="chart-title"><span className="num-badge">15</span>브랜드별 매출 대비 전환율 분석</div>
                <div className="chart-subtitle">{fmtPeriodLabel(period,weekFrom,weekTo)} 기준 · X축 매출, Y축 전환율</div>
              </div>
              {insights && <CorrBadge r={insights.corrRevConv}/>}
            </div>
            {insights && (
              <div className="chart-header-insight" style={{marginTop:8,minHeight:36}}>
                {insights.sigRevConv?(()=>{const c=corrDesc(insights.corrRevConv); return <>매출과 전환율 간에는 <span className="hl">{c.strength} {c.dir}의 상관관계</span>(상관계수 <span className="hl">{insights.corrRevConv.toFixed(2)}</span>)가 있어, {c.dir==='양'?'매출이 높은 브랜드일수록 전환율도 높은 경향이 있습니다':'매출이 높다고 전환 효율까지 높은 것은 아닙니다'}.</>;})():<>매출과 전환율 간에 뚜렷한 상관관계는 보이지 않아, 매출 규모만으로는 전환 효율을 설명하기 어렵습니다.</>}
              </div>
            )}
          </div>
          <ResponsiveContainer width="100%" height={320}>
            <ScatterChart margin={{left:20,right:30,top:20,bottom:20}}>
              <CartesianGrid strokeDasharray="3 3" stroke="#EAEAEA"/>
              <XAxis type="number" dataKey="rev" name="Revenue" tickFormatter={fmtM} tick={{fill:'#6E6E6E',fontSize:11}} axisLine={false} tickLine={false}
                label={{value:'Revenue',position:'insideBottom',offset:-8,fontSize:11,fill:'#6E6E6E'}}/>
              <YAxis type="number" dataKey="conv" name="Conversion Rate" tickFormatter={v=>v+'%'} tick={{fill:'#6E6E6E',fontSize:11}} axisLine={false} tickLine={false}
                label={{value:'Conversion Rate',angle:-90,position:'insideLeft',fontSize:11,fill:'#6E6E6E'}}/>
              <Tooltip content={<CustomScatterTooltip xKey="rev" xLabel="Revenue" xFmt={fmtM}/>} cursor={{strokeDasharray:'3 3'}}/>
              <Scatter data={revConvData}>
                {revConvData.map(d=><Cell key={d.brand} fill={d.color}/>)}
                <LabelList dataKey="brand" position="top" style={{fontSize:11,fontWeight:600,fill:'var(--c-brown)'}}/>
              </Scatter>
            </ScatterChart>
          </ResponsiveContainer>
          <BarLegend data={revConvData}/>
        </div>

        <div className="chart-card">
          <div className="chart-header" style={{flexDirection:'column',alignItems:'stretch'}}>
            <div>
              <div className="chart-title"><span className="num-badge">16</span>OS별 점유율</div>
              <div className="chart-subtitle">{fmtPeriodLabel(period,weekFrom,weekTo)} 기준 · 10개 브랜드 판매량(Units Sold) 기준</div>
            </div>
            {osPieData.length>0 && (
              <div className="chart-header-insight" style={{marginTop:8,minHeight:36}}>
                <span className="hl">{osPieData[0].name}</span>이 <span className="hl">{fmtPct(osPieData[0].pct)}</span>로 가장 큰 비중을 차지하며, 상위 3개 OS가 전체의 <span className="hl">{fmtPct(osPieData.slice(0,3).reduce((s,d)=>s+d.pct,0))}</span>를 차지합니다.
              </div>
            )}
          </div>
          <ResponsiveContainer width="100%" height={320}>
            <PieChart margin={{top:24,right:20,bottom:0,left:20}}>
              <Pie data={osPieData} cx="50%" cy="50%" innerRadius={65} outerRadius={110}
                dataKey="value" nameKey="name" paddingAngle={2} labelLine={false}
                label={(props)=>{
                  const {cx,cy,midAngle,outerRadius,index}=props;
                  if(index!==0 && index!==osPieData.length-1) return null;
                  const RADIAN=Math.PI/180;
                  const radius=outerRadius+18;
                  const x=cx+radius*Math.cos(-midAngle*RADIAN);
                  const y=cy+radius*Math.sin(-midAngle*RADIAN);
                  return <text x={x} y={y} fill="var(--c-brown)" fontSize={11} fontWeight={700} textAnchor={x>cx?'start':'end'} dominantBaseline="central">{fmtK(osPieData[index].value)}</text>;
                }}>
                {osPieData.map((d,i)=><Cell key={d.name} fill={d.fill}/>)}
              </Pie>
              <Tooltip content={<CustomOsPieTooltip/>}/>
            </PieChart>
          </ResponsiveContainer>
          <BarLegend data={osPieData}/>
        </div>
      </div>

      <div className="charts-grid-1">
        <div className="chart-card">
          <div className="chart-header">
            <div>
              <div className="chart-title"><span className="num-badge">17</span>모델별 상세</div>
              <div className="chart-subtitle">{fmtPeriodLabel(period,weekFrom,weekTo)} 기준 · {MODEL_TABLE_COLUMNS.find(c=>c.key===modelSort).label} 기준 내림차순 상위 15개 · 컬럼명을 클릭하면 기준이 바뀝니다</div>
            </div>
          </div>
          <div style={{overflowX:'auto'}}>
            <table style={{borderCollapse:'collapse',width:'100%',fontSize:12}}>
              <thead>
                <tr>
                  {MODEL_TABLE_COLUMNS.map(col=>(
                    <th key={col.key}
                        onClick={col.sortable?()=>setModelSort(col.key):undefined}
                        style={{textAlign:col.align,padding:'8px 10px',borderBottom:'2px solid var(--c-khaki)',
                          color:col.sortable?(modelSort===col.key?'var(--c-red)':'#1a56db'):'var(--c-gray-dark)',
                          textDecoration:col.sortable?'underline':'none',textUnderlineOffset:'3px',
                          whiteSpace:'nowrap',cursor:col.sortable?'pointer':'default',userSelect:'none',fontWeight:600}}>
                      {col.label}{col.sortable&&modelSort===col.key?' ▼':''}
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {(topModels||[]).map((m,i)=>(
                  <tr key={m.retailer_sku+'_'+i} style={{borderBottom:'1px solid var(--c-gray-light)'}}>
                    {MODEL_TABLE_COLUMNS.map(col=>(
                      <td key={col.key} style={{padding:'7px 10px',textAlign:col.align,whiteSpace:'nowrap',fontWeight:col.sortable&&modelSort===col.key?700:400}}>
                        {col.key==='retailer_sku'?(
                          <a href={`https://www.amazon.com/dp/${m.retailer_sku}`} target="_blank" rel="noopener noreferrer" style={{color:'#1a56db',textDecoration:'underline'}}>{m.retailer_sku}</a>
                        ):fmtModelCell(col,m)}
                      </td>
                    ))}
                  </tr>
                ))}
              </tbody>
            </table>
            {!topModels && <div style={{padding:'14px 4px',color:'var(--c-gray-dark)',fontSize:12}}>불러오는 중...</div>}
            {topModels&&topModels.length===0 && <div style={{padding:'14px 4px',color:'var(--c-gray-dark)',fontSize:12}}>표시할 데이터가 없습니다.</div>}
          </div>
        </div>
      </div>
    </div>
    <div className="resize-handle" onMouseDown={onHandleMouseDown}/>
    <div className={"chat-col"+(mobileChatOpen?" mobile-open":"")} style={{width:chatWidth}}>
      <ChatPanel onClose={()=>setMobileChatOpen(false)}/>
    </div>
    <button className="chat-fab" onClick={()=>setMobileChatOpen(true)} aria-label="Insight Finder 열기">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
    </button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
